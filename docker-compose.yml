services:
  # Our PostgresSQL database
  db:
    #Using the latest PostgreSQL image
    image: postgres:latest


    ports:
      - '5432:5432'
    restart: always
    environment:
      POSTGRES_PASSWORD: ayush


  redis:
    image: redis:7-alpine
    container_name: eventhub-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: eventhub-rabbitmq
    ports:
      - "5672:5672"   # AMQP Protocol
      - "15672:15672" # RabbitMQ Management Web Dashboard
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  #Database management interface
  adminer:
    image: adminer:latest
    restart: always
    ports:
      - 8888:8080


  keycloak:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - "9090:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - keycloak-data:/opt/keycloak/data
    command:
      - start-dev
      - --db=dev-file

volumes:
  keycloak-data:
    driver: local
